<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Steal My Brainrot</title>
<style>
:root{
  --bg:#0d1222;--panel:rgba(13,18,34,.94);--text:#f8fbff;--muted:#a8b4cb;
  --gold:#ffd54a;--green:#6ee7a3;--red:#ff6b7a;--blue:#60a5fa;--purple:#c084fc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1222;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
button{font:inherit}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#82d7ff,#c6f4ff 35%,#6dcf72 36%,#3a9c50)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:7px;align-items:flex-start;pointer-events:none}
.card{pointer-events:auto;background:rgba(12,16,32,.84);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.25);backdrop-filter:blur(8px);border-radius:14px;padding:8px 10px}
.stats{min-width:150px}
.title{font-weight:900;letter-spacing:.3px}
.small{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:#28324c;margin-top:5px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#4ade80,#facc15);width:0%}
.actions{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:58%}
.btn{border:0;border-radius:12px;padding:9px 11px;font-weight:900;background:#fff;color:#10162a;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.gold{background:var(--gold)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:white}
.bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.joy{width:132px;height:132px;border-radius:50%;background:rgba(12,16,32,.45);border:2px solid rgba(255,255,255,.2);pointer-events:auto;position:relative;touch-action:none}
.knob{position:absolute;width:56px;height:56px;border-radius:50%;left:38px;top:38px;background:rgba(255,255,255,.92);box-shadow:0 4px 20px rgba(0,0,0,.25)}
.rightActions{pointer-events:auto;display:flex;gap:8px;align-items:flex-end}
.big{width:102px;height:58px;border-radius:18px}
.notice{position:absolute;left:50%;top:86px;transform:translateX(-50%);background:rgba(12,16,32,.9);padding:10px 14px;border-radius:14px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;max-width:84%;text-align:center}
.notice.show{opacity:1}
.modalBack{position:absolute;inset:0;background:rgba(3,6,15,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modalBack.show{display:flex}
.modal{width:min(520px,100%);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:16px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.close{width:40px;height:40px;border:0;border-radius:12px;background:#252d45;color:white;font-size:22px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.item{background:#171e33;border:1px solid #2d3859;border-radius:14px;padding:10px}
.item strong{display:block;margin-bottom:4px}
.item button{margin-top:8px;width:100%}
.start{position:absolute;inset:0;z-index:30;background:radial-gradient(circle at 50% 30%,#2b4f88,#10162a 65%);display:flex;align-items:center;justify-content:center;padding:24px}
.startCard{text-align:center;width:min(520px,100%)}
.logo{font-size:clamp(42px,10vw,74px);font-weight:1000;line-height:.9;text-transform:uppercase;text-shadow:0 5px 0 #702fca,0 10px 24px #000}
.logo span{color:var(--gold)}
.startBtns{display:grid;gap:10px;margin-top:26px}
.startBtns button{font-size:20px;padding:16px}
.pill{display:inline-block;margin-top:12px;background:rgba(255,255,255,.1);padding:7px 10px;border-radius:999px;color:#dce8ff;font-size:12px}
#eventBadge{position:absolute;top:92px;right:12px;background:#7c3aed;color:white;border-radius:999px;padding:8px 12px;font-weight:900;display:none}
@media(min-width:900px){.joy{width:150px;height:150px}.knob{left:47px;top:47px}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="card stats">
      <div class="title">Lv <span id="level">1</span> · Harvest</div>
      <div class="small"><span id="xp">0</span>/<span id="xpNeed">100</span> XP</div>
      <div class="bar"><div class="fill" id="xpFill"></div></div>
      <div class="small" style="margin-top:6px">🪵 <span id="wood">0</span> · 🪨 <span id="stone">0</span> · ⚙️ <span id="scrap">0</span> · 💰 <span id="coins">60</span></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="Game.openBase()">BASE</button>
      <button class="btn blue" onclick="Game.openCraft()">CRAFT</button>
      <button class="btn gold" onclick="Game.openShop()">SHOP</button>
      <button class="btn" onclick="Game.openSettings()">⚙</button>
    </div>
  </div>

  <div id="eventBadge">BOSS EVENT</div>
  <div class="notice" id="notice"></div>

  <div class="bottom">
    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
    <div class="rightActions">
      <button class="btn green big" onclick="Game.harvest()">HARVEST</button>
      <button class="btn red big" onclick="Game.attack()">ATTACK</button>
    </div>
  </div>

  <div class="modalBack" id="modalBack" onclick="if(event.target===this)Game.closeTopModal()">
    <div class="modal">
      <div class="modalHead">
        <div><div class="title" id="modalTitle">Menu</div><div class="small" id="modalSub"></div></div>
        <button class="close" onclick="Game.closeTopModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="start" id="start">
    <div class="startCard">
      <div class="logo">STEAL MY <span>BRAINROT</span></div>
      <div class="pill">V70 BETA RC1 · MOBILE PROTOTYPE</div>
      <p style="color:#c7d3ec">Harvest, craft, upgrade your base, survive bosses and steal smarter.</p>
      <div class="startBtns">
        <button class="btn gold" onclick="Game.start()">PLAY</button>
        <button class="btn" onclick="Game.openSettings(true)">SETTINGS</button>
      </div>
      <div class="small" style="margin-top:14px">Music starts on the first interaction allowed by the device.</div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.max(1, Math.min(2, devicePixelRatio || 1));
let W=0,H=0;

const world = { w: 3000, h: 2200 };
const state = {
  started:false, t:0,
  player:{x:1500,y:1100,r:20,speed:220,hp:100,weapon:1,armor:0},
  cam:{x:0,y:0},
  inv:{wood:0,stone:0,scrap:0,coins:60},
  base:{level:1,wood:0,stone:0,scrap:0,shieldUntil:0},
  harvest:{level:1,xp:0},
  nodes:[],
  enemies:[],
  boss:null,
  lastEvent:0,
  nextEvent:150,
  raidCooldown:0,
  muted:false,
  musicOn:true
};

const nodeDefs = {
  wood:{emoji:'🌲',name:'Wood',color:'#219653',need:1,respawn:10},
  stone:{emoji:'🪨',name:'Stone',color:'#8a99a8',need:1,respawn:12},
  scrap:{emoji:'⚙️',name:'Scrap',color:'#e9a23b',need:2,respawn:16}
};

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function xpNeed(){return 80+state.harvest.level*40}

function createWorld(){
  state.nodes.length=0;
  const types=['wood','wood','wood','stone','stone','scrap'];
  for(let i=0;i<120;i++){
    state.nodes.push({
      x:rand(120,world.w-120), y:rand(120,world.h-120),
      type:types[i%types.length], active:true, respawnAt:0, pulse:rand(0,6.28)
    });
  }
  state.enemies.length=0;
  for(let i=0;i<10;i++){
    state.enemies.push({x:rand(200,2800),y:rand(200,2000),r:18,hp:35,maxHp:35,speed:42,stealChance:.06,alive:true,respawnAt:0});
  }
}
createWorld();

function resize(){
  const r=canvas.getBoundingClientRect(); W=r.width;H=r.height;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

let joy={x:0,y:0,active:false,id:null};
const joyEl=document.getElementById('joy'), knob=document.getElementById('knob');
function setJoy(e){
  const p=e.touches?e.touches[0]:e;
  const r=joyEl.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=p.clientX-cx,dy=p.clientY-cy; const m=Math.hypot(dx,dy),max=r.width*.32;
  if(m>max){dx*=max/m;dy*=max/m}
  joy.x=dx/max;joy.y=dy/max;
  knob.style.transform=`translate(${dx}px,${dy}px)`;
}
joyEl.addEventListener('pointerdown',e=>{joy.active=true;joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);setJoy(e)});
joyEl.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)setJoy(e)});
function endJoy(){joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);

let audioCtx=null, musicTimer=null;
function audio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq,dur=.08,type='square',gain=.04){
  if(state.muted)return;
  const a=audio(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);
}
function startMusic(){
  if(!state.musicOn||state.muted||musicTimer)return;
  audio();
  const melody=[523,659,784,659,698,880,784,659,587,698,880,1046,880,784,698,659];
  let i=0;
  musicTimer=setInterval(()=>{tone(melody[i++%melody.length],.16,'triangle',.025)},190);
}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}

function notify(s){
  const n=document.getElementById('notice');n.textContent=s;n.classList.add('show');
  clearTimeout(notify.t);notify.t=setTimeout(()=>n.classList.remove('show'),1800);
}

function addXP(n){
  state.harvest.xp+=n;
  while(state.harvest.xp>=xpNeed()){
    state.harvest.xp-=xpNeed();
    state.harvest.level++;
    tone(1046,.18,'sine',.08); notify('Harvest level up! Level '+state.harvest.level);
  }
}

function nearestNode(){
  let best=null,bd=9999;
  for(const n of state.nodes){
    if(!n.active)continue; const d=dist(n,state.player);
    if(d<bd){bd=d;best=n}
  }
  return {node:best,d:bd};
}

function harvest(){
  const {node,d}=nearestNode();
  if(!node||d>95)return notify('Move closer to a resource');
  const def=nodeDefs[node.type];
  if(state.harvest.level<def.need)return notify(`${def.name} needs Harvest Lv ${def.need}`);
  const amount=Math.random()<.16?2:1;
  state.inv[node.type]+=amount;
  addXP(node.type==='scrap'?18:12);
  node.active=false; node.respawnAt=state.t+def.respawn;
  tone(node.type==='stone'?180:node.type==='scrap'?700:330,.08);
  notify(`+${amount} ${def.name}${amount>1?' · RARE FIND!':''}`);
  refreshHUD();
}

function attack(){
  let target=null,bd=110;
  const all=state.boss?[...state.enemies,state.boss]:state.enemies;
  for(const e of all){if(e&&e.alive!==false){const d=dist(e,state.player);if(d<bd){bd=d;target=e}}}
  if(!target)return notify('No enemy in range');
  const dmg=12+state.player.weapon*7;
  target.hp-=dmg;tone(120,.09,'sawtooth',.05);
  if(target.hp<=0){
    target.alive=false; target.respawnAt=state.t+(target.isBoss?9999:25);
    const reward=target.isBoss?80:8;state.inv.coins+=reward;
    if(target.isBoss){state.boss=null;document.getElementById('eventBadge').style.display='none';notify('BOSS DEFEATED! +80 coins')}
    else notify('NPC defeated +8 coins');
  }
  refreshHUD();
}

function maybeRaid(dt){
  if(state.t<state.raidCooldown||state.t<state.base.shieldUntil)return;
  if(Math.random()<dt*0.0012){
    state.raidCooldown=state.t+75;
    const total=state.base.wood+state.base.stone+state.base.scrap;
    if(total<=0)return;
    const type=['wood','stone','scrap'].sort(()=>Math.random()-.5).find(k=>state.base[k]>0);
    if(type){
      const taken=Math.min(state.base[type],1);
      state.base[type]-=taken;
      notify(`Raid! NPC stole ${taken} ${type}. Raid protection active.`);
      tone(90,.3,'square',.05);
    }
  }
}

function spawnBoss(){
  state.boss={x:rand(300,world.w-300),y:rand(300,world.h-300),r:34,hp:180,maxHp:180,speed:54,isBoss:true,alive:true};
  document.getElementById('eventBadge').style.display='block';
  notify('Boss event started!');tone(70,.5,'sawtooth',.08);
  state.nextEvent=state.t+180+rand(0,70);
}

function update(dt){
  if(!state.started)return;
  state.t+=dt;
  let dx=joy.x,dy=joy.y;
  if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;
  if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;
  const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
  state.player.x=clamp(state.player.x+dx*state.player.speed*dt,40,world.w-40);
  state.player.y=clamp(state.player.y+dy*state.player.speed*dt,40,world.h-40);

  for(const n of state.nodes)if(!n.active&&state.t>=n.respawnAt)n.active=true;
  for(const e of state.enemies){
    if(!e.alive){if(state.t>=e.respawnAt){e.alive=true;e.hp=e.maxHp;e.x=rand(100,2900);e.y=rand(100,2100)};continue}
    const d=dist(e,state.player);
    if(d<300&&d>55){e.x+=(state.player.x-e.x)/d*e.speed*dt;e.y+=(state.player.y-e.y)/d*e.speed*dt}
  }
  if(state.boss){
    const e=state.boss,d=dist(e,state.player);
    if(d<500&&d>70){e.x+=(state.player.x-e.x)/d*e.speed*dt;e.y+=(state.player.y-e.y)/d*e.speed*dt}
  }
  if(state.t>state.nextEvent&&!state.boss)spawnBoss();
  maybeRaid(dt);

  state.cam.x=clamp(state.player.x-W/2,0,Math.max(0,world.w-W));
  state.cam.y=clamp(state.player.y-H/2,0,Math.max(0,world.h-H));
}

function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const cam=state.cam;
  ctx.save();ctx.translate(-cam.x,-cam.y);

  ctx.fillStyle='#58b95e';ctx.fillRect(0,0,world.w,world.h);
  ctx.fillStyle='#68c96c';
  for(let y=0;y<world.h;y+=180)for(let x=0;x<world.w;x+=180){ctx.beginPath();ctx.arc(x+70,y+50,50,0,Math.PI*2);ctx.fill()}

  ctx.fillStyle='#dbc27e';rr(world.w/2-180,world.h/2-150,360,300,35);ctx.fill();
  ctx.fillStyle='#7a4a2a';rr(world.w/2-110,world.h/2-80,220,160,18);ctx.fill();
  ctx.fillStyle='#ef6c57';ctx.fillRect(world.w/2-75,world.h/2-50,150,90);
  ctx.font='700 24px system-ui';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('HOME BASE',world.w/2,world.h/2+5);

  for(const n of state.nodes){
    if(!n.active)continue;
    if(n.x<cam.x-80||n.x>cam.x+W+80||n.y<cam.y-80||n.y>cam.y+H+80)continue;
    n.pulse+=.03; const pulse=1+Math.sin(n.pulse)*.08;
    ctx.save();ctx.translate(n.x,n.y);ctx.scale(pulse,pulse);
    ctx.shadowColor=nodeDefs[n.type].color;ctx.shadowBlur=18;
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(nodeDefs[n.type].emoji,0,0);
    ctx.restore();
  }

  for(const e of state.enemies){
    if(!e.alive)continue;ctx.fillStyle='#6d28d9';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.font='20px serif';ctx.fillText('😈',e.x,e.y+6);health(e);
  }
  if(state.boss){
    const e=state.boss;ctx.fillStyle='#b91c1c';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.font='38px serif';ctx.fillText('👹',e.x,e.y+12);health(e);
  }

  ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(state.player.x,state.player.y,state.player.r,0,Math.PI*2);ctx.fill();
  ctx.font='24px serif';ctx.fillText('🧢',state.player.x,state.player.y+7);
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(state.player.x,state.player.y,state.player.r+3,0,Math.PI*2);ctx.stroke();

  ctx.restore();

  const nn=nearestNode();
  if(nn.node&&nn.d<110){
    ctx.fillStyle='rgba(12,16,32,.8)';rr(W/2-88,H-178,176,34,14);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='800 14px system-ui';ctx.textAlign='center';
    ctx.fillText(`${nodeDefs[nn.node.type].emoji} ${nodeDefs[nn.node.type].name} · ${Math.round(nn.d)}m`,W/2,H-156);
  }
}

function health(e){
  ctx.fillStyle='#1f2937';ctx.fillRect(e.x-25,e.y-e.r-14,50,6);
  ctx.fillStyle='#ef4444';ctx.fillRect(e.x-25,e.y-e.r-14,50*Math.max(0,e.hp/e.maxHp),6);
}

function refreshHUD(){
  document.getElementById('level').textContent=state.harvest.level;
  document.getElementById('xp').textContent=state.harvest.xp;
  document.getElementById('xpNeed').textContent=xpNeed();
  document.getElementById('xpFill').style.width=(state.harvest.xp/xpNeed()*100)+'%';
  for(const k of ['wood','stone','scrap','coins'])document.getElementById(k).textContent=state.inv[k];
}

function modal(title,sub,html){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalSub').textContent=sub||'';
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modalBack').classList.add('show');
}
function closeTopModal(){
  const m=document.getElementById('modalBack');
  if(m.classList.contains('show')){m.classList.remove('show');return true}
  return false;
}

function deposit(){
  for(const k of ['wood','stone','scrap']){state.base[k]+=state.inv[k];state.inv[k]=0}
  state.base.shieldUntil=state.t+30;
  notify('Resources stored · 30s base shield');
  refreshHUD();openBase();
}
function upgradeBase(){
  const cost={wood:8*state.base.level,stone:5*state.base.level,scrap:Math.max(0,state.base.level-1)*2};
  if(Object.keys(cost).some(k=>state.base[k]<cost[k]))return notify('Not enough stored resources');
  for(const k in cost)state.base[k]-=cost[k];
  state.base.level++;notify('Base upgraded to Lv '+state.base.level);tone(880,.18,'sine',.08);openBase();
}
function openBase(){
  const l=state.base.level,c={wood:8*l,stone:5*l,scrap:Math.max(0,l-1)*2};
  modal('Home Base','Raid-safe storage and upgrades',`
    <div class="grid">
      <div class="item"><strong>Base Lv ${l}</strong><div class="small">Stored: 🪵 ${state.base.wood} · 🪨 ${state.base.stone} · ⚙️ ${state.base.scrap}</div>
        <button class="btn green" onclick="Game.deposit()">STORE BACKPACK</button></div>
      <div class="item"><strong>Upgrade</strong><div class="small">Cost: 🪵 ${c.wood} · 🪨 ${c.stone} · ⚙️ ${c.scrap}</div>
        <button class="btn gold" onclick="Game.upgradeBase()">UPGRADE BASE</button></div>
    </div>
    <p class="small">NPC raids are intentionally uncommon. After a raid there is a long cooldown before another can happen.</p>`);
}

const recipes=[
  {name:'Scrap Blade',desc:'+1 weapon tier',cost:{wood:3,stone:2,scrap:2},do:()=>state.player.weapon++},
  {name:'Patch Armor',desc:'+1 armor tier',cost:{wood:2,stone:3,scrap:2},do:()=>state.player.armor++},
  {name:'Raid Shield',desc:'90 sec base protection',cost:{wood:2,stone:2,scrap:1},do:()=>state.base.shieldUntil=state.t+90}
];
function canCost(c){return Object.keys(c).every(k=>state.inv[k]>=c[k])}
function pay(c){for(const k in c)state.inv[k]-=c[k]}
function craft(i){
  const r=recipes[i];if(!canCost(r.cost))return notify('Not enough resources');
  pay(r.cost);r.do();notify(r.name+' crafted');tone(740,.12,'triangle',.06);refreshHUD();openCraft();
}
function openCraft(){
  modal('Crafting',`Weapon ${state.player.weapon} · Armor ${state.player.armor}`,
    `<div class="grid">${recipes.map((r,i)=>`<div class="item"><strong>${r.name}</strong><div class="small">${r.desc}<br>${Object.entries(r.cost).map(([k,v])=>`${k} ${v}`).join(' · ')}</div><button class="btn blue" onclick="Game.craft(${i})">CRAFT</button></div>`).join('')}</div>`);
}

const shop=[
  {name:'Resource Crate',price:35,buy:()=>{state.inv.wood+=3;state.inv.stone+=3;state.inv.scrap+=1}},
  {name:'Harvest Boost',price:50,buy:()=>addXP(60)},
  {name:'Emergency Shield',price:45,buy:()=>state.base.shieldUntil=state.t+120}
];
function buy(i){
  const s=shop[i];if(state.inv.coins<s.price)return notify('Not enough coins');
  state.inv.coins-=s.price;s.buy();notify(s.name+' bought');tone(980,.1,'sine',.05);refreshHUD();openShop();
}
function openShop(){
  modal('Shop','Spend coins earned from enemies and bosses',
    `<div class="grid">${shop.map((s,i)=>`<div class="item"><strong>${s.name}</strong><div class="small">💰 ${s.price}</div><button class="btn gold" onclick="Game.buy(${i})">BUY</button></div>`).join('')}</div>`);
}

function openSettings(fromStart=false){
  modal('Settings','Audio and gameplay',
    `<div class="grid">
      <div class="item"><strong>Music</strong><div class="small">${state.musicOn?'On':'Off'}</div><button class="btn" onclick="Game.toggleMusic()">${state.musicOn?'TURN OFF':'TURN ON'}</button></div>
      <div class="item"><strong>Mute</strong><div class="small">${state.muted?'Muted':'Sound on'}</div><button class="btn" onclick="Game.toggleMute()">${state.muted?'UNMUTE':'MUTE'}</button></div>
    </div>
    <p class="small">Tip: mobile browsers may require one tap before audio playback can begin.</p>`);
}
function toggleMusic(){state.musicOn=!state.musicOn;if(state.musicOn)startMusic();else stopMusic();openSettings()}
function toggleMute(){state.muted=!state.muted;if(!state.muted&&state.musicOn)startMusic();openSettings()}

function start(){
  audio();startMusic();document.getElementById('start').style.display='none';state.started=true;notify('Find glowing resources and harvest them!');
}

window.Game={start,harvest,attack,openBase,openCraft,openShop,openSettings,closeTopModal,deposit,upgradeBase,craft,buy,toggleMusic,toggleMute};

refreshHUD();
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener('pointerdown',()=>{if(state.started&&state.musicOn&&!state.muted)startMusic()},{once:false});
})();
</script>
</body>
</html>
